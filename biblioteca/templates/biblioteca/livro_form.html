{% extends "biblioteca/base.html" %}
{% block title %}{% if object %}Editar Livro{% else %}Novo Livro{% endif %}{% endblock %}
{% block content %}
    <h1>{% if object %}Editar Livro{% else %}Novo Livro{% endif %}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
    </form>
{% endblock %}
