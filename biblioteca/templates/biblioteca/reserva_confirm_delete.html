{% extends "biblioteca/base.html" %}
{% block title %}Excluir Reserva{% endblock %}
{% block content %}
    <h1>Excluir reserva de "{{ object.livro.titulo }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar exclusão</button>
        <a href="{% url 'biblioteca:reserva_list' %}">Cancelar</a>
    </form>
{% endblock %}
